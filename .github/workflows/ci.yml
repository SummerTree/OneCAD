name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install qt@6 opencascade eigen

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_PREFIX_PATH="/opt/homebrew/opt/qt" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Test
        run: cd build && ctest --output-on-failure -j4

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev libqt6opengl6-dev qt6-base-dev-tools \
            libqt6svg6-dev \
            libocct-modeling-algorithms-dev libocct-modeling-data-dev \
            libocct-data-exchange-dev libocct-foundation-dev \
            libocct-visualization-dev \
            libeigen3-dev \
            cmake ninja-build

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: cd build && ctest --output-on-failure -j4
